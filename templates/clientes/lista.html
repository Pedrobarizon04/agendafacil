{% extends "base.html" %}
{% block titulo %}Clientes{% endblock %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Clientes</h2>
  <a class="btn btn-dark" href="{{ url_for('cliente_form') }}"><i class="bi bi-plus-lg"></i> Novo cliente</a>
</div>
<form class="mb-3" method="get">
  <div class="input-group">
    <input class="form-control" name="q" value="{{ busca }}" placeholder="Buscar por nome ou telefone">
    <button class="btn btn-outline-secondary"><i class="bi bi-search"></i> Buscar</button>
  </div>
</form>
<div class="table-responsive">
<table class="table table-hover bg-white shadow-sm rounded">
  <thead class="table-light"><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th class="text-end">Ações</th></tr></thead>
  <tbody>
  {% for c in clientes %}
    <tr>
      <td>{{ c['nome'] }}</td>
      <td>{{ c['telefone'] }}</td>
      <td>{{ c['email'] or '—' }}</td>
      <td class="text-end btn-acoes">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('cliente_form', id=c['id']) }}" title="Editar"><i class="bi bi-pencil"></i></a>
        <form method="post" action="{{ url_for('cliente_excluir', id=c['id']) }}" onsubmit="return confirm('Excluir {{ c['nome'] }}?')">
          <button class="btn btn-sm btn-outline-danger" title="Excluir"><i class="bi bi-trash"></i></button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="text-center text-muted py-4">Nenhum cliente encontrado.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
