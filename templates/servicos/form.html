{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if servico else 'Novo' }} serviço{% endblock %}
{% block conteudo %}
<h2 class="mb-3">{{ 'Editar' if servico else 'Novo' }} serviço</h2>
<div class="card shadow-sm" style="max-width: 640px"><div class="card-body">
<form method="post">
  <div class="mb-3">
    <label class="form-label" for="nome">Nome *</label>
    <input class="form-control" id="nome" name="nome" required value="{{ servico['nome'] if servico else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="descricao">Descrição</label>
    <input class="form-control" id="descricao" name="descricao" value="{{ (servico['descricao'] or '') if servico else '' }}">
  </div>
  <div class="row">
    <div class="col mb-3">
      <label class="form-label" for="preco">Preço (R$) *</label>
      <input class="form-control" type="number" step="0.01" min="0" id="preco" name="preco" required value="{{ servico['preco'] if servico else '' }}">
    </div>
    <div class="col mb-3">
      <label class="form-label" for="duracao_min">Duração (min) *</label>
      <input class="form-control" type="number" min="1" id="duracao_min" name="duracao_min" required value="{{ servico['duracao_min'] if servico else '30' }}">
    </div>
  </div>
  <button class="btn btn-dark" type="submit">Salvar</button>
  <a class="btn btn-link" href="{{ url_for('servicos_lista') }}">Cancelar</a>
</form>
</div></div>
{% endblock %}
