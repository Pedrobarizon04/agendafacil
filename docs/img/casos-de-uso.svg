<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fff"/>

  <!-- Fronteira do sistema -->
  <rect x="230" y="20" width="650" height="520" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="555" y="48" text-anchor="middle" font-weight="bold" font-size="16">Sistema AgendaFácil</text>

  <!-- Ator -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="100" cy="232" r="16"/>
    <line x1="100" y1="248" x2="100" y2="302"/>
    <line x1="68" y1="268" x2="132" y2="268"/>
    <line x1="100" y1="302" x2="76" y2="342"/>
    <line x1="100" y1="302" x2="124" y2="342"/>
  </g>
  <text x="100" y="368" text-anchor="middle" font-weight="bold">Atendente</text>

  <!-- Associações ator - casos de uso -->
  <g stroke="#222" stroke-width="1.4">
    <line x1="134" y1="262" x2="276" y2="100"/>
    <line x1="134" y1="266" x2="276" y2="190"/>
    <line x1="134" y1="270" x2="276" y2="280"/>
    <line x1="134" y1="274" x2="276" y2="370"/>
    <line x1="134" y1="278" x2="276" y2="460"/>
  </g>

  <!-- Casos de uso -->
  <g fill="#fdf1e6" stroke="#f58220" stroke-width="2">
    <ellipse cx="410" cy="100" rx="134" ry="32"/>
    <ellipse cx="410" cy="190" rx="134" ry="32"/>
    <ellipse cx="410" cy="280" rx="134" ry="32"/>
    <ellipse cx="410" cy="370" rx="134" ry="32"/>
    <ellipse cx="410" cy="460" rx="134" ry="32"/>
    <ellipse cx="750" cy="460" rx="112" ry="38"/>
  </g>
  <g text-anchor="middle">
    <text x="410" y="96" font-weight="bold">UC01</text><text x="410" y="114">Autenticar usuário</text>
    <text x="410" y="186" font-weight="bold">UC02</text><text x="410" y="204">Manter clientes</text>
    <text x="410" y="276" font-weight="bold">UC03</text><text x="410" y="294">Manter profissionais</text>
    <text x="410" y="366" font-weight="bold">UC04</text><text x="410" y="384">Manter serviços</text>
    <text x="410" y="456" font-weight="bold">UC05</text><text x="410" y="474">Gerenciar agendamentos</text>
    <text x="750" y="455">Verificar disponibilidade</text><text x="750" y="473">do profissional</text>
  </g>

  <!-- include -->
  <line x1="544" y1="460" x2="636" y2="460" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#seta)"/>
  <text x="590" y="448" text-anchor="middle" font-size="14">«include»</text>
</svg>
